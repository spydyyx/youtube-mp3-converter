<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ImageLift – Free Image Enhancer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * {
      box-sizing: border-box;
      font-family: "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #e6f0ff, #ffffff);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1e293b;
    }

    .container {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 80, 200, 0.15);
      text-align: center;
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      margin-bottom: 8px;
      color: #2563eb;
    }

    p {
      font-size: 14px;
      color: #475569;
      margin-bottom: 25px;
    }

    input[type="file"] {
      display: none;
    }

    .upload-box {
      border: 2px dashed #93c5fd;
      padding: 25px;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.2s;
      background: #f8fbff;
    }

    .upload-box:hover {
      background: #eef5ff;
    }

    .upload-box span {
      color: #2563eb;
      font-weight: 600;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      background: #93c5fd;
      cursor: not-allowed;
    }

    .status {
      margin-top: 15px;
      font-size: 14px;
    }

    .preview {
      margin-top: 15px;
      display: none;
    }

    .preview img {
      max-width: 100%;
      border-radius: 10px;
    }

    footer {
      margin-top: 25px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>ImageLift</h1>
    <p>Free AI-powered image enhancer. Upload & improve your image quality.</p>

    <label class="upload-box">
      <input type="file" id="imageInput" accept="image/*" />
      <span>Click to upload an image</span>
    </label>

    <div class="preview" id="preview">
      <img id="previewImg" />
    </div>

    <button id="enhanceBtn" disabled>Enhance Image</button>

    <div class="status" id="status"></div>

    <footer>
      © 2026 ImageLift — 100% Free
    </footer>
  </div>

  <script>
    const imageInput = document.getElementById("imageInput");
    const enhanceBtn = document.getElementById("enhanceBtn");
    const statusText = document.getElementById("status");
    const preview = document.getElementById("preview");
    const previewImg = document.getElementById("previewImg");

    let selectedFile = null;

    imageInput.addEventListener("change", () => {
      selectedFile = imageInput.files[0];
      if (!selectedFile) return;

      preview.style.display = "block";
      previewImg.src = URL.createObjectURL(selectedFile);
      enhanceBtn.disabled = false;
      statusText.textContent = "";
    });

    enhanceBtn.addEventListener("click", async () => {
      if (!selectedFile) return;

      statusText.textContent = "Enhancing image… please wait ⏳";
      enhanceBtn.disabled = true;

      const formData = new FormData();
      formData.append("image", selectedFile);

      try {
        const res = await fetch("YOUR_BACKEND_URL/enhance", {
          method: "POST",
          body: formData
        });

        if (!res.ok) throw new Error("Enhancement failed");

        const blob = await res.blob();
        const url = URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.href = url;
        a.download = "enhanced-image.png";
        a.click();

        statusText.textContent = "✅ Done! Image downloaded.";
      } catch (err) {
        statusText.textContent = "❌ Something went wrong.";
      } finally {
        enhanceBtn.disabled = false;
      }
    });
  </script>

</body>
</html>
