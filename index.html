<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YouTube Converter</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
}

body {
  height: 100vh;
  background: #000;
  color: #fff;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Background animation */
.background {
  position: absolute;
  inset: 0;
  background:
    repeating-linear-gradient(
      45deg,
      rgba(255,255,255,0.02) 0px,
      rgba(255,255,255,0.02) 1px,
      transparent 1px,
      transparent 20px
    );
  animation: moveBg 20s linear infinite;
}

@keyframes moveBg {
  from { background-position: 0 0; }
  to { background-position: 400px 400px; }
}

/* Card */
.container {
  position: relative;
  z-index: 1;
  background: rgba(0,0,0,0.85);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 16px;
  padding: 40px;
  width: 360px;
  backdrop-filter: blur(10px);
  animation: fadeUp 1s ease;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

h1 {
  text-align: center;
  margin-bottom: 10px;
  font-weight: 600;
}

p {
  text-align: center;
  font-size: 14px;
  opacity: 0.7;
  margin-bottom: 25px;
}

input {
  width: 100%;
  padding: 12px;
  background: #000;
  border: 1px solid rgba(255,255,255,0.2);
  color: #fff;
  border-radius: 8px;
  margin-bottom: 15px;
}

select, button {
  width: 100%;
  padding: 12px;
  background: #000;
  color: #fff;
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 8px;
  margin-bottom: 15px;
  cursor: pointer;
}

button {
  transition: all 0.3s ease;
}

button:hover {
  background: #fff;
  color: #000;
}

.hidden {
  display: none;
}

.status {
  text-align: center;
  font-size: 13px;
  opacity: 0.7;
}
</style>
</head>

<body>
<div class="background"></div>

<div class="container">
  <h1>YouTube Converter</h1>
  <p>Paste a link and choose format</p>

  <input type="text" placeholder="https://youtube.com/watch?v=..." />

  <select id="format">
    <option value="">Select format</option>
    <option value="mp3">MP3 (Audio)</option>
    <option value="mp4">MP4 (Video)</option>
  </select>

  <select id="quality" class="hidden"></select>

  <button id="download">Download</button>

  <div class="status hidden" id="status">Preparing download…</div>
</div>

<script>
const format = document.getElementById("format");
const quality = document.getElementById("quality");
const status = document.getElementById("status");

format.addEventListener("change", () => {
  quality.innerHTML = "";
  quality.classList.remove("hidden");

  if (format.value === "mp3") {
    quality.innerHTML = `
      <option>192 kbps</option>
      <option>256 kbps</option>
    `;
  } else if (format.value === "mp4") {
    quality.innerHTML = `
      <option>720p</option>
      <option>1080p</option>
    `;
  } else {
    quality.classList.add("hidden");
  }
});

document.getElementById("download").addEventListener("click", () => {
  status.classList.remove("hidden");
  status.textContent = "Preparing download…";

  setTimeout(() => {
    status.textContent = "This demo is frontend-only.";
  }, 2500);
});
</script>

</body>
</html>
