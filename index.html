<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>YT Converter</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 30px;
      border: 1px solid #333;
      background: #000;
    }

    h1 {
      text-align: center;
      font-weight: 300;
      letter-spacing: 2px;
      margin-bottom: 30px;
    }

    input, select, button {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      background: #000;
      border: 1px solid #555;
      color: #fff;
      font-size: 14px;
    }

    input::placeholder {
      color: #777;
    }

    .radio-group {
      display: flex;
      justify-content: space-between;
      margin-top: 15px;
    }

    .radio-group label {
      font-size: 14px;
    }

    button {
      margin-top: 25px;
      cursor: pointer;
      letter-spacing: 1px;
      transition: background 0.2s;
    }

    button:hover {
      background: #fff;
      color: #000;
    }

    .status {
      margin-top: 20px;
      font-size: 13px;
      color: #aaa;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>YT CONVERTER</h1>

    <input
      id="ytLink"
      type="text"
      placeholder="Paste YouTube link"
    />

    <div class="radio-group">
      <label>
        <input type="radio" name="format" value="mp3" checked />
        MP3
      </label>

      <label>
        <input type="radio" name="format" value="mp4" />
        MP4
      </label>
    </div>

    <select id="quality">
      <option value="192">192 kbps</option>
      <option value="256">256 kbps</option>
      <option value="720">720p</option>
      <option value="1080">1080p</option>
    </select>

    <button onclick="startConvert()">DOWNLOAD</button>

    <div class="status" id="status">
      Waiting for input…
    </div>
  </div>

  <script>
    const backendURL = "https://render-backend-test.onrender.com";

    async function startConvert() {
      const ytLink = document.getElementById("ytLink").value;
      const format = document.querySelector('input[name="format"]:checked').value;
      const quality = document.getElementById("quality").value;
      const status = document.getElementById("status");

      if (!ytLink) {
        alert("Paste a YouTube link first");
        return;
      }

      status.textContent = "Sending request to backend…";

      try {
        const response = await fetch(backendURL + "/convert", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            url: ytLink,
            format: format,
            quality: quality
          })
        });

        const data = await response.json();
        console.log(data);

        status.textContent = "Backend connected ✅ (check console)";
      } catch (err) {
        console.error(err);
        status.textContent = "Backend error ❌";
      }
    }
  </script>

</body>
</html>
