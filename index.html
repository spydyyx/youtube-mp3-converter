<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>YouTube to MP3 Converter</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  min-height:100vh;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  color:#fff;
  overflow:hidden;
}

/* Container */
.container{
  width:90%;
  max-width:420px;
  padding:40px 30px;
  background:rgba(255,255,255,0.04);
  border-radius:20px;
  backdrop-filter:blur(15px);
  box-shadow:0 0 40px rgba(0,255,255,0.15);
  text-align:center;
  animation:fadeIn 1s ease;
}

/* Title */
.container h1{
  color:#00ffff;
  font-weight:600;
  margin-bottom:10px;
}

.container p{
  font-size:0.9rem;
  color:#bbb;
  margin-bottom:25px;
}

/* Input */
input{
  width:100%;
  padding:14px 16px;
  border-radius:12px;
  border:none;
  outline:none;
  background:#0b0b0b;
  color:#fff;
  font-size:0.95rem;
  box-shadow:inset 0 0 0 1px #1f1f1f;
}

/* Button */
button{
  margin-top:20px;
  width:100%;
  padding:14px;
  border-radius:30px;
  border:none;
  background:#00ffff;
  color:#000;
  font-weight:600;
  cursor:pointer;
  box-shadow:0 0 25px rgba(0,255,255,0.5);
  transition:0.3s;
}

button:hover{
  transform:scale(1.03);
}

/* Status */
.status{
  margin-top:20px;
  font-size:0.9rem;
  color:#00ffff;
  min-height:20px;
}

/* Loader */
.loader{
  margin:15px auto 0;
  width:28px;
  height:28px;
  border:3px solid rgba(255,255,255,0.2);
  border-top:3px solid #00ffff;
  border-radius:50%;
  animation:spin 1s linear infinite;
  display:none;
}

/* Animations */
@keyframes spin{
  to{transform:rotate(360deg);}
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(20px);}
  to{opacity:1; transform:translateY(0);}
}
</style>
</head>

<body>

<div class="container">
  <h1>YouTube to MP3</h1>
  <p>Paste a YouTube link and convert it to audio</p>

  <input type="text" id="link" placeholder="https://youtube.com/watch?v=..." />
  <button onclick="convert()">Convert</button>

  <div class="loader" id="loader"></div>
  <div class="status" id="status"></div>
</div>

<script>
function convert(){
  const link = document.getElementById("link").value.trim();
  const status = document.getElementById("status");
  const loader = document.getElementById("loader");

  if(!link){
    status.textContent = "Please paste a valid YouTube link.";
    return;
  }

  status.textContent = "Processing audio...";
  loader.style.display = "block";

  setTimeout(()=>{
    loader.style.display = "none";
    status.textContent = "Audio ready. (Backend coming next)";
  }, 2500);
}
</script>

</body>
</html>
